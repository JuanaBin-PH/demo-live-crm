<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JuanaBinPH Live CRM</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{font-family:Arial;background:#f5f7fb;margin:0;padding:20px}
h1{color:#b52a2a;text-align:center}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,0.1);max-width:1100px;margin:20px auto}
table{width:100%;border-collapse:collapse;margin-top:15px}
th{background:#b52a2a;color:white;padding:10px;text-align:left}
td{padding:8px;border-bottom:1px solid #eee}
#status{text-align:center;padding:10px;font-weight:bold;color:#b52a2a}
</style>
</head>
<body>
<h1>🏡 JuanaBinPH - Live CRM Demo</h1>
<div class="card">
<div id="status">Loading Excel from AWS S3...</div>
<table id="crmTable"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
</div>

<script>
const EXCEL_URL = "https://demo-crm-juanabinph-2026-277666.s3.ap-southeast-1.amazonaws.com/demo.projectjuanabinph.xlsx";

fetch(EXCEL_URL)
.then(res => {
  if(!res.ok) throw new Error("Access Denied pa - check bucket policy");
  return res.arrayBuffer();
})
.then(data => {
  const workbook = XLSX.read(data, {type:"array"});
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const json = XLSX.utils.sheet_to_json(sheet, {header:1});

  document.getElementById("status").innerText = "✅ LIVE - Loaded " + (json.length-1) + " records from S3";

  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");

  let headHtml = "<tr>";
  json[0].forEach(h => headHtml += "<th>"+h+"</th>");
  headHtml += "</tr>";
  thead.innerHTML = headHtml;

  let bodyHtml = "";
  for(let i=1; i<json.length; i++){
    bodyHtml += "<tr>";
    json[i].forEach(c => bodyHtml += "<td>"+(c||"")+"</td>");
    bodyHtml += "</tr>";
  }
  tbody.innerHTML = bodyHtml;
})
.catch(err => {
  document.getElementById("status").innerText = "❌ " + err.message + " - " + EXCEL_URL;
});
</script>
</body>
</html>
